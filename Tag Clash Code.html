<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tag Clash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #030310;
  display: flex; align-items: center; justify-content: center;
  width: 100vw; height: 100vh;
  overflow: hidden; touch-action: none;
  font-family: 'Poppins', -apple-system, system-ui, sans-serif;
}
#canvas { display: block; }
#touch-ui {
  position: fixed; bottom: 0; left: 0; width: 100%;
  pointer-events: none; z-index: 10; display: none;
}
.dpad {
  position: absolute; bottom: 14px;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}
#dpad-left  { left: 14px; }
#dpad-right { right: 14px; }
.dpad-row { display: flex; gap: 8px; }
.tbtn {
  width: 62px; height: 62px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.2);
  background: rgba(10,10,30,0.7);
  color: rgba(255,255,255,0.9); font-size: 20px; font-weight: 700;
  cursor: pointer; pointer-events: all;
  user-select: none; -webkit-user-select: none;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.07s, transform 0.07s;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.tbtn:active { background: rgba(255,255,255,0.2); transform: scale(0.9); }
.tbtn.p1 { border-color: rgba(0,200,255,0.5); box-shadow: 0 0 14px rgba(0,200,255,0.25), inset 0 0 8px rgba(0,200,255,0.1); }
.tbtn.p2 { border-color: rgba(255,30,100,0.5);  box-shadow: 0 0 14px rgba(255,30,100,0.25), inset 0 0 8px rgba(255,30,100,0.1); }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="touch-ui">
  <div class="dpad" id="dpad-left">
    <div class="dpad-row"><div class="tbtn p1" id="b-p1j">↑</div></div>
    <div class="dpad-row">
      <div class="tbtn p1" id="b-p1l">←</div>
      <div class="tbtn p1" id="b-p1r">→</div>
    </div>
  </div>
  <div class="dpad" id="dpad-right">
    <div class="dpad-row"><div class="tbtn p2" id="b-p2j">↑</div></div>
    <div class="dpad-row">
      <div class="tbtn p2" id="b-p2l">←</div>
      <div class="tbtn p2" id="b-p2r">→</div>
    </div>
  </div>
</div>
<script>
// ─── CANVAS / DPR ────────────────────────────────────────────────────────────
const GW = 800, GH = 450;
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let scale = 1, offX = 0, offY = 0;
const FONT = "'Poppins', -apple-system, system-ui, sans-serif";

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const sw = window.innerWidth, sh = window.innerHeight;
  let cw, ch;
  if (sw / sh > GW / GH) { ch = sh; cw = ch * GW / GH; }
  else { cw = sw; ch = cw * GH / GW; }
  cw = Math.floor(cw); ch = Math.floor(ch);
  canvas.style.width  = cw + 'px';
  canvas.style.height = ch + 'px';
  canvas.width  = GW * dpr;
  canvas.height = GH * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  scale = cw / GW;
  offX = (window.innerWidth - cw) / 2;
  offY = (window.innerHeight - ch) / 2;
  const tc = document.getElementById('touch-ui');
  tc.style.left  = offX + 'px';
  tc.style.width = cw + 'px';
  tc.style.display = ('ontouchstart' in window || navigator.maxTouchPoints > 0) ? 'block' : 'none';
  const sz = Math.floor(Math.min(cw * 0.13, 64));
  document.querySelectorAll('.tbtn').forEach(b => {
    b.style.width = b.style.height = sz + 'px';
    b.style.fontSize = Math.floor(sz * 0.32) + 'px';
  });
}
window.addEventListener('resize', resize);
resize();

if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
    r = Math.min(+r||0, w/2, h/2);
    this.beginPath();
    this.moveTo(x+r,y); this.lineTo(x+w-r,y);
    this.quadraticCurveTo(x+w,y,x+w,y+r); this.lineTo(x+w,y+h-r);
    this.quadraticCurveTo(x+w,y+h,x+w-r,y+h); this.lineTo(x+r,y+h);
    this.quadraticCurveTo(x,y+h,x,y+h-r); this.lineTo(x,y+r);
    this.quadraticCurveTo(x,y,x+r,y); this.closePath(); return this;
  };
}

// ─── COLOR HELPERS ───────────────────────────────────────────────────────────
function hexRgb(hex) {
  const n = parseInt(hex.replace('#',''),16);
  return [(n>>16)&255,(n>>8)&255,n&255];
}
function rgba(hex, a) { const [r,g,b]=hexRgb(hex); return `rgba(${r},${g},${b},${a})`; }
function lighten(hex, amt) {
  const [r,g,b]=hexRgb(hex);
  return `rgb(${Math.min(255,r+amt)},${Math.min(255,g+amt)},${Math.min(255,b+amt)})`;
}

// ─── MAPS ────────────────────────────────────────────────────────────────────
const MAPS = [
  {

    platforms:[
      {x:0,  y:400,w:220,h:50,ground:true},{x:580,y:400,w:220,h:50,ground:true},

    ],

  {

    sky1:'#001840', sky2:'#003060',

    ground:'#002233', groundTop:'#00ffcc',
    deco:'bubbles',
    platforms:[
      {x:0,  y:422,w:155,h:28,ground:true},{x:645,y:422,w:155,h:28,ground:true},
      {x:170,y:365,w:145,h:20},{x:485,y:365,w:145,h:20},
      {x:312,y:302,w:176,h:20},{x:85, y:254,w:135,h:20},
      {x:580,y:254,w:135,h:20},{x:265,y:195,w:270,h:20},
      {x:150,y:143,w:108,h:20},{x:542,y:143,w:108,h:20},
    ],
    spawns:[{x:35,y:390},{x:716,y:390}]
  },
  {
    name:'Inferno', desc:'Enclosed cavern — watch out!',
    sky1:'#0e0100', sky2:'#1e0300',
    accent:'#ff5500', cardBg:'#881a00',
    ground:'#1a0500', groundTop:'#ff5500',
    deco:'embers',
    platforms:[
      {x:0,  y:400,w:800,h:50,ground:true},
      {x:0,  y:0,  w:800,h:26,ground:true},{x:0,y:0,w:26,h:450,ground:true},{x:774,y:0,w:26,h:450,ground:true},
      {x:188,y:308,w:158,h:20},{x:454,y:308,w:158,h:20},
      {x:88, y:230,w:128,h:20},{x:320,y:248,w:160,h:20},
      {x:584,y:230,w:128,h:20},{x:242,y:158,w:118,h:20},
      {x:440,y:158,w:118,h:20},
    ],
    spawns:[{x:90,y:365},{x:666,y:365}]
  }
];

// ─── CONSTANTS ───────────────────────────────────────────────────────────────
const GRAVITY=0.52, JUMP_VEL=-11.5, MOVE_SPEED=4.4, FRICTION=0.70;
const TAG_RADIUS=36, TAG_COOLDOWN=900, ROUND_SECS=90, WIN_SCORE=5;

const CARD_W=210, CARD_H=98, CARD_GAP=20;
const CX0 = (GW-(2*CARD_W+CARD_GAP))/2;
const CARD_POS=[
  {x:CX0,              y:108},
  {x:CX0+CARD_W+CARD_GAP, y:108},
  {x:CX0,              y:108+CARD_H+CARD_GAP},
  {x:CX0+CARD_W+CARD_GAP, y:108+CARD_H+CARD_GAP},
];

// Home button — top-right corner of HUD
const HB = {x:GW-42, y:9, w:34, h:34};

// ─── STATE ───────────────────────────────────────────────────────────────────
const S={MENU:0,HOW:1,MAP_SELECT:2,COUNTDOWN:3,PLAYING:4,ROUND_END:5,WIN:6};
let gs=S.MENU, scores=[0,0], mapIdx=0;
let roundTimer=ROUND_SECS, countdownN=3;
let timerHandle=null, cdHandle=null, itIdx=0, lastTag=0;
let winnerIdx=-1, roundEndMsg='', mouseX=0, mouseY=0;

// ─── PLAYERS ─────────────────────────────────────────────────────────────────
const P=[
  {x:100,y:350,vx:0,vy:0,w:28,h:40,grounded:false,
   color:'#00ccff',darkColor:'#0066bb',it:false,name:'P1',facing:1,tagFlash:0,
   canJump:2,djFlash:0},
  {x:650,y:350,vx:0,vy:0,w:28,h:40,grounded:false,
   color:'#ff2060',darkColor:'#aa0033',it:false,name:'P2',facing:-1,tagFlash:0,
   canJump:2,djFlash:0},
];

// ─── INPUT ───────────────────────────────────────────────────────────────────
const K={}, T={p1l:false,p1r:false,p1j:false,p2l:false,p2r:false,p2j:false};

document.addEventListener('keydown',e=>{
  K[e.code]=true;
  if(gs===S.MENU){ if(e.code==='Enter'||e.code==='Space') gs=S.MAP_SELECT; if(e.code==='KeyH') gs=S.HOW; }
  else if(gs===S.HOW||gs===S.MAP_SELECT){ if(e.code==='Escape') gs=S.MENU; }
  else if(gs===S.WIN){ if(e.code==='Enter'||e.code==='Space') resetGame(); }
  else if(gs===S.PLAYING||gs===S.COUNTDOWN||gs===S.ROUND_END){
    if(e.code==='Escape'){ clearTimers(); gs=S.MENU; }
  }
  e.preventDefault();
});
document.addEventListener('keyup',e=>{K[e.code]=false;});
canvas.addEventListener('mousemove',e=>{
  const r=canvas.getBoundingClientRect();
  mouseX=(e.clientX-r.left)/scale; mouseY=(e.clientY-r.top)/scale;
});

[['b-p1l','p1l'],['b-p1r','p1r'],['b-p1j','p1j'],
 ['b-p2l','p2l'],['b-p2r','p2r'],['b-p2j','p2j']].forEach(([id,prop])=>{
  const el=document.getElementById(id); if(!el) return;
  el.addEventListener('touchstart',e=>{T[prop]=true; e.preventDefault();},{passive:false});
  el.addEventListener('touchend',  e=>{T[prop]=false;e.preventDefault();},{passive:false});
  el.addEventListener('touchcancel',e=>{T[prop]=false;},{passive:false});
});

canvas.addEventListener('click',e=>{
  const r=canvas.getBoundingClientRect();
  handleClick((e.clientX-r.left)/scale,(e.clientY-r.top)/scale);
});
canvas.addEventListener('touchend',e=>{
  const r=canvas.getBoundingClientRect(),t=e.changedTouches[0];
  handleClick((t.clientX-r.left)/scale,(t.clientY-r.top)/scale);
  e.preventDefault();
},{passive:false});

function inR(cx,cy,x,y,w,h){return cx>=x&&cx<=x+w&&cy>=y&&cy<=y+h;}

function handleClick(cx,cy){
  // Home button — visible during active gameplay states
  if((gs===S.PLAYING||gs===S.COUNTDOWN||gs===S.ROUND_END)&&inR(cx,cy,HB.x,HB.y,HB.w,HB.h)){
    clearTimers(); gs=S.MENU; return;
  }
  if(gs===S.MENU){
    if(inR(cx,cy,GW/2-125,248,250,52)) gs=S.MAP_SELECT;
    if(inR(cx,cy,GW/2-125,318,250,52)) gs=S.HOW;
  } else if(gs===S.HOW){
    if(inR(cx,cy,GW/2-105,382,210,46)) gs=S.MENU;
  } else if(gs===S.MAP_SELECT){
    CARD_POS.forEach((pos,i)=>{ if(inR(cx,cy,pos.x,pos.y,CARD_W,CARD_H)){mapIdx=i;startCountdown();} });
    if(inR(cx,cy,GW/2-115,348,230,48)){mapIdx=Math.floor(Math.random()*MAPS.length);startCountdown();}
    if(inR(cx,cy,24,GH-50,110,36)) gs=S.MENU;
  } else if(gs===S.WIN){
    if(inR(cx,cy,GW/2-125,330,250,52)) resetGame();
  }
}

// ─── ROUND MANAGEMENT ────────────────────────────────────────────────────────
function spawnPlayers(){
  const m=MAPS[mapIdx];
  [0,1].forEach(i=>{P[i].x=m.spawns[i].x;P[i].y=m.spawns[i].y-P[i].h;P[i].vx=P[i].vy=0;P[i].grounded=false;P[i].canJump=2;P[i].djFlash=0;});
}
function clearTimers(){
  if(timerHandle){clearInterval(timerHandle);timerHandle=null;}
  if(cdHandle){clearInterval(cdHandle);cdHandle=null;}
}
function startCountdown(){
  clearTimers(); spawnPlayers();
  itIdx=Math.floor(Math.random()*2);
  P[0].it=(itIdx===0); P[1].it=(itIdx===1);
  countdownN=3; gs=S.COUNTDOWN;
  cdHandle=setInterval(()=>{ countdownN--; if(countdownN<=0){clearInterval(cdHandle);cdHandle=null;startRound();} },1000);
}
function startRound(){
  gs=S.PLAYING; roundTimer=ROUND_SECS; lastTag=Date.now(); prevJ=[false,false];
  timerHandle=setInterval(()=>{ if(gs!==S.PLAYING)return; roundTimer--; if(roundTimer<=0)endRound(); },1000);
}
function endRound(){
  clearTimers(); gs=S.ROUND_END;
  const sc=P[0].it?1:0; scores[sc]++;
  roundEndMsg=`${P[sc].name} scores a point!`;
  if(scores[sc]>=WIN_SCORE){ winnerIdx=sc; setTimeout(()=>{gs=S.WIN;},2200); }
  else setTimeout(()=>startNextRound(),2600);
}
function startNextRound(){
  clearTimers(); spawnPlayers();
  itIdx=1-itIdx; P[0].it=(itIdx===0); P[1].it=(itIdx===1);
  countdownN=3; gs=S.COUNTDOWN;
  cdHandle=setInterval(()=>{ countdownN--; if(countdownN<=0){clearInterval(cdHandle);cdHandle=null;startRound();} },1000);
}
function resetGame(){ clearTimers(); scores=[0,0]; winnerIdx=-1; itIdx=0; gs=S.MAP_SELECT; }

// ─── PHYSICS ─────────────────────────────────────────────────────────────────
function movePlayer(p,left,right,jumpEdge){
  if(left){p.vx=-MOVE_SPEED;p.facing=-1;}
  else if(right){p.vx=MOVE_SPEED;p.facing=1;}
  else p.vx*=FRICTION;
  if(jumpEdge&&p.canJump>0){
    p.vy=p.canJump===2?JUMP_VEL:JUMP_VEL*0.88;
    if(p.canJump===1){p.djFlash=0.6;}
    p.canJump--;p.grounded=false;
  }
  p.vy=Math.min(p.vy+GRAVITY,16);
  p.x+=p.vx; p.y+=p.vy;
  if(p.x<0){p.x=0;p.vx=0;} if(p.x+p.w>GW){p.x=GW-p.w;p.vx=0;}
  if(p.y<0&&p.vy<0){p.vy=0;}
  if(p.y>GH+80){
    const sp=MAPS[mapIdx].spawns[P.indexOf(p)];
    p.x=sp.x;p.y=-p.h;p.vx=0;p.vy=2;p.canJump=0;p.tagFlash=0.8;
  }
  p.grounded=false;
  for(const pl of MAPS[mapIdx].platforms) collide(p,pl);
  if(p.djFlash>0)p.djFlash=Math.max(0,p.djFlash-0.04);
}
function collide(p,pl){
  if(p.x+p.w<=pl.x||p.x>=pl.x+pl.w||p.y+p.h<=pl.y||p.y>=pl.y+pl.h)return;
  const ol=(p.x+p.w)-pl.x,or_=(pl.x+pl.w)-p.x,ot=(p.y+p.h)-pl.y,ob=(pl.y+pl.h)-p.y;
  const m=Math.min(ol,or_,ot,ob);
  if(m===ot&&p.vy>=0){p.y=pl.y-p.h;p.vy=0;p.grounded=true;p.canJump=2;}
  else if(m===ob&&p.vy<0){p.y=pl.y+pl.h;p.vy=0;}
  else if(m===ol){p.x=pl.x-p.w;p.vx=0;}
  else{p.x=pl.x+pl.w;p.vx=0;}
}
function checkTag(){
  if(Date.now()-lastTag<TAG_COOLDOWN)return;
  const dx=(P[0].x+P[0].w/2)-(P[1].x+P[1].w/2),dy=(P[0].y+P[0].h/2)-(P[1].y+P[1].h/2);
  if(dx*dx+dy*dy<TAG_RADIUS*TAG_RADIUS){
    P[0].it=!P[0].it;P[1].it=!P[1].it;itIdx=P[0].it?0:1;
    lastTag=Date.now();P[0].tagFlash=0.7;P[1].tagFlash=0.7;
  }
}

// ─── DRAW HELPERS ────────────────────────────────────────────────────────────
function rr(x,y,w,h,r,fill,stroke,lw){
  ctx.beginPath(); ctx.roundRect(x,y,w,h,r);
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.lineWidth=lw||1.5;ctx.strokeStyle=stroke;ctx.stroke();}
}
function txt(s,x,y,font,fill,align,base){
  ctx.font=font;ctx.textAlign=align||'center';ctx.textBaseline=base||'alphabetic';
  ctx.fillStyle=fill;ctx.fillText(s,x,y);
}
function gtxt(s,x,y,font,fill,align,blur,sc){
  ctx.save();ctx.shadowColor=sc||'rgba(0,0,0,0.9)';ctx.shadowBlur=blur||5;
  ctx.font=font;ctx.textAlign=align||'center';ctx.textBaseline='alphabetic';
  ctx.fillStyle=fill;ctx.fillText(s,x,y);ctx.restore();
}
function glassPanel(x,y,w,h,r,accent){
  rr(x,y,w,h,r,'rgba(255,255,255,0.04)',rgba(accent||'#ffffff',0.18),1);
  const sg=ctx.createLinearGradient(x,y,x,y+h*0.4);
  sg.addColorStop(0,'rgba(255,255,255,0.08)');sg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.beginPath();ctx.roundRect(x+1,y+1,w-2,h*0.4,r-1);ctx.fillStyle=sg;ctx.fill();
}
function modernBtn(x,y,w,h,label,c1,c2,hov){
  const a=hov?1:0.88;
  ctx.save();
  if(hov){ctx.shadowColor=c1;ctx.shadowBlur=18;}
  const g=ctx.createLinearGradient(x,y,x,y+h);
  g.addColorStop(0,c1);g.addColorStop(1,c2||c1);
  rr(x,y,w,h,12,g,rgba('#ffffff',0.25),1.5);
  // shine
  const sh=ctx.createLinearGradient(x,y+2,x,y+h*0.5);
  sh.addColorStop(0,'rgba(255,255,255,0.22)');sh.addColorStop(1,'rgba(255,255,255,0)');
  ctx.beginPath();ctx.roundRect(x+2,y+2,w-4,h*0.46,10);ctx.fillStyle=sh;ctx.fill();
  ctx.restore();
  gtxt(label,x+w/2,y+h/2+7,`700 17px ${FONT}`,'#fff','center',6,'rgba(0,0,0,0.8)');
}

// ─── BACKGROUNDS ─────────────────────────────────────────────────────────────
const bgParticles=Array.from({length:60},(_,i)=>({
  x:(i*173)%GW, y:(i*97)%GH,
  vx:(Math.random()-0.5)*0.3, vy:(Math.random()-0.5)*0.3,
  r:0.8+Math.random()*1.6, a:0.2+Math.random()*0.5,
  tw:Math.random()*Math.PI*2
}));
const embers=Array.from({length:35},()=>({
  x:Math.random()*GW, y:GH-Math.random()*100,
  vx:(Math.random()-0.5)*0.6, vy:-(0.5+Math.random()*1.0),
  life:Math.random(), r:1.5+Math.random()*2.5
}));
const bubbles=Array.from({length:20},(_,i)=>({
  x:(i*137)%GW, y:GH-(i*80)%GH,
  vy:-(0.3+Math.random()*0.5), r:3+Math.random()*8, a:0.08+Math.random()*0.12
}));
let gridOff=0;

function drawBg(){
  const m=MAPS[mapIdx],t=Date.now()/1000;
  const sg=ctx.createLinearGradient(0,0,0,GH);
  sg.addColorStop(0,m.sky1);sg.addColorStop(1,m.sky2);
  ctx.fillStyle=sg;ctx.fillRect(0,0,GW,GH);

  // Soft ambient orbs
  ctx.save();ctx.globalAlpha=0.06;
  const [ar,ag,ab]=hexRgb(m.accent);
  const o1=ctx.createRadialGradient(150,180,10,150,180,240);
  o1.addColorStop(0,`rgb(${ar},${ag},${ab})`);o1.addColorStop(1,'transparent');
  ctx.fillStyle=o1;ctx.fillRect(0,0,GW,GH);
  const o2=ctx.createRadialGradient(650,300,10,650,300,210);
  o2.addColorStop(0,`rgb(${ar},${ag},${ab})`);o2.addColorStop(1,'transparent');
  ctx.fillStyle=o2;ctx.fillRect(0,0,GW,GH);
  ctx.restore();

  if(m.deco==='grid'||m.deco==='synthgrid'){
    gridOff=(gridOff+0.3)%40;
    ctx.save();ctx.globalAlpha=m.deco==='synthgrid'?0.12:0.07;
    ctx.strokeStyle=m.accent;ctx.lineWidth=0.5;
    for(let x=gridOff%40;x<GW;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,GH);ctx.stroke();}
    for(let y=gridOff%40;y<GH;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(GW,y);ctx.stroke();}
    if(m.deco==='synthgrid'){
      // Perspective horizon lines
      ctx.globalAlpha=0.18;
      for(let i=0;i<8;i++){
        const py2=GH*0.5+i*30;
        ctx.beginPath();ctx.moveTo(0,py2);ctx.lineTo(GW,py2);ctx.stroke();
      }
    }
    ctx.restore();
  }
  if(m.deco==='embers'){
    for(const e of embers){
      e.x+=e.vx;e.y+=e.vy;e.life-=0.007;
      if(e.life<0){e.x=Math.random()*GW;e.y=GH-5;e.life=0.7+Math.random()*0.3;}
    }
    ctx.save();
    for(const e of embers){
      ctx.globalAlpha=e.life*0.75;
      ctx.fillStyle=`hsl(${15+e.life*25},100%,${55+e.life*30}%)`;
      ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  }
  if(m.deco==='bubbles'){
    for(const b of bubbles){
      b.y+=b.vy;if(b.y+b.r<0){b.y=GH+b.r;b.x=Math.random()*GW;}
    }
    ctx.save();
    for(const b of bubbles){
      ctx.globalAlpha=b.a;
      ctx.strokeStyle=m.accent;ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.stroke();
    }
    ctx.restore();
  }
  // Floating particles (all maps)
  ctx.save();
  for(const p of bgParticles){
    p.x=(p.x+p.vx+GW)%GW;p.y=(p.y+p.vy+GH)%GH;
    ctx.globalAlpha=p.a*Math.abs(Math.sin(p.tw+t*0.8));
    ctx.fillStyle=m.accent;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

function drawPlatforms(){
  const m=MAPS[mapIdx];
  const [ar,ag,ab]=hexRgb(m.accent);
  for(const pl of m.platforms){
    if(pl.ground){
      // Solid ground / walls
      const gg=ctx.createLinearGradient(0,pl.y,0,pl.y+pl.h);
      gg.addColorStop(0,m.ground);gg.addColorStop(1,m.sky1);
      ctx.fillStyle=gg;ctx.fillRect(pl.x,pl.y,pl.w,pl.h);
      // Top line
      const tg=ctx.createLinearGradient(pl.x,pl.y,pl.x+pl.w,pl.y);
      tg.addColorStop(0,'rgba(255,255,255,0)');tg.addColorStop(0.3,m.groundTop);
      tg.addColorStop(0.7,m.groundTop);tg.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=tg;ctx.fillRect(pl.x,pl.y,pl.w,2);
    } else {
      // Glassmorphism floating platform
      ctx.fillStyle=`rgba(${ar},${ag},${ab},0.09)`;
      ctx.beginPath();ctx.roundRect(pl.x,pl.y,pl.w,pl.h,5);ctx.fill();
      // Border
      ctx.strokeStyle=`rgba(${ar},${ag},${ab},0.35)`;ctx.lineWidth=1;
      ctx.beginPath();ctx.roundRect(pl.x+.5,pl.y+.5,pl.w-1,pl.h-1,5);ctx.stroke();
      // Top glow line
      const tg=ctx.createLinearGradient(pl.x,pl.y,pl.x+pl.w,pl.y);
      tg.addColorStop(0,'rgba(255,255,255,0)');tg.addColorStop(0.2,m.accent);
      tg.addColorStop(0.8,m.accent);tg.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=tg;
      ctx.beginPath();ctx.roundRect(pl.x+2,pl.y,pl.w-4,2.5,[2,2,0,0]);ctx.fill();
      // Soft under-glow
      ctx.save();ctx.shadowColor=m.accent;ctx.shadowBlur=10;
      ctx.strokeStyle=`rgba(${ar},${ag},${ab},0.2)`;ctx.lineWidth=1;
      ctx.beginPath();ctx.roundRect(pl.x,pl.y,pl.w,pl.h,5);ctx.stroke();
      ctx.restore();
    }
  }
}

// ─── CHARACTERS (modern capsule, no hat) ─────────────────────────────────────
function drawCharacter(p){
  const t=Date.now()/1000;
  const px=p.x,py=p.y,w=p.w,h=p.h,cr=w*0.48;

  // Tag burst flash
  if(p.tagFlash>0){
    ctx.save();
    const flash=ctx.createRadialGradient(px+w/2,py+h/2,0,px+w/2,py+h/2,w*1.2);
    flash.addColorStop(0,`rgba(255,255,255,${p.tagFlash})`);
    flash.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=flash;ctx.fillRect(px-w,py-w,w*3,h+w*2);
    ctx.restore();
    p.tagFlash=Math.max(0,p.tagFlash-0.05);
  }

  // Ground shadow
  if(p.grounded){
    ctx.save();
    const sd=ctx.createRadialGradient(px+w/2,py+h+4,1,px+w/2,py+h+4,w*0.75);
    sd.addColorStop(0,'rgba(0,0,0,0.4)');sd.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=sd;
    ctx.beginPath();ctx.ellipse(px+w/2,py+h+4,w*0.75,7,0,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  // Double jump flash ring
  if(p.djFlash>0){
    ctx.save();
    ctx.globalAlpha=p.djFlash;
    ctx.strokeStyle='rgba(255,255,255,0.9)';ctx.lineWidth=2.5;
    const djR=w*(0.7+(1-p.djFlash)*0.6);
    ctx.beginPath();ctx.ellipse(px+w/2,py+h*0.5,djR,djR*1.2,0,0,Math.PI*2);ctx.stroke();
    ctx.restore();
  }

  // IT — pulsing outer ring
  if(p.it){
    const pulse=0.5+0.5*Math.sin(t*4.5);
    const rSize=w*0.62+pulse*10;
    ctx.save();
    ctx.shadowColor='#ffd700';ctx.shadowBlur=24+pulse*14;
    ctx.strokeStyle=`rgba(255,215,0,${0.55+0.45*pulse})`;ctx.lineWidth=2.5;
    ctx.beginPath();ctx.ellipse(px+w/2,py+h*0.5,rSize,rSize*1.25,0,0,Math.PI*2);ctx.stroke();
    // Second outer ring
    ctx.globalAlpha=0.3*pulse;
    ctx.strokeStyle='#ffd700';ctx.lineWidth=1;
    ctx.beginPath();ctx.ellipse(px+w/2,py+h*0.5,rSize+7,rSize*1.25+8,0,0,Math.PI*2);ctx.stroke();
    ctx.restore();
  }

  // Body — smooth pill / capsule
  const bodyGrad=ctx.createLinearGradient(px,py,px+w*0.7,py+h);
  bodyGrad.addColorStop(0,lighten(p.color,55));
  bodyGrad.addColorStop(0.35,p.color);
  bodyGrad.addColorStop(1,p.darkColor);
  ctx.fillStyle=bodyGrad;
  ctx.beginPath();ctx.roundRect(px,py,w,h,cr);ctx.fill();

  // Rim outline (subtle)
  ctx.strokeStyle=rgba(p.color,0.55);ctx.lineWidth=1.5;
  ctx.beginPath();ctx.roundRect(px+.75,py+.75,w-1.5,h-1.5,cr-.75);ctx.stroke();

  // Specular highlight (top-left shine)
  const shine=ctx.createLinearGradient(px,py,px+w*0.65,py+h*0.5);
  shine.addColorStop(0,'rgba(255,255,255,0.38)');
  shine.addColorStop(0.6,'rgba(255,255,255,0.08)');
  shine.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=shine;
  ctx.beginPath();ctx.roundRect(px+1,py+1,w-2,h*0.52,cr-1);ctx.fill();

  // Eyes
  const eyeY=py+h*0.33;
  const eox=p.facing>0?1.5:-1.5;
  // Whites
  ctx.fillStyle='rgba(255,255,255,0.95)';
  ctx.beginPath();
  ctx.ellipse(px+w*0.32+eox,eyeY,4.2,4.8,0,0,Math.PI*2);
  ctx.ellipse(px+w*0.68+eox,eyeY,4.2,4.8,0,0,Math.PI*2);
  ctx.fill();
  // Pupils
  ctx.fillStyle='#0d0d1a';
  ctx.beginPath();
  ctx.arc(px+w*0.34+eox,eyeY+0.6,2.4,0,Math.PI*2);
  ctx.arc(px+w*0.66+eox,eyeY+0.6,2.4,0,Math.PI*2);
  ctx.fill();
  // Shine dots
  ctx.fillStyle='#fff';
  ctx.beginPath();
  ctx.arc(px+w*0.355+eox,eyeY-0.7,1,0,Math.PI*2);
  ctx.arc(px+w*0.675+eox,eyeY-0.7,1,0,Math.PI*2);
  ctx.fill();

  // Smile
  ctx.save();
  ctx.strokeStyle='rgba(0,0,0,0.35)';ctx.lineWidth=1.5;ctx.lineCap='round';
  ctx.beginPath();ctx.arc(px+w/2+eox,eyeY+9,5,0.15,Math.PI-0.15);ctx.stroke();
  ctx.restore();

  // Squash/stretch legs hint — two small rounded bumps at bottom when grounded
  if(p.grounded){
    const walkAnim=Math.abs(p.vx)>0.5?Math.sin(t*14)*3:0;
    ctx.fillStyle=p.darkColor;
    ctx.beginPath();ctx.ellipse(px+w*0.3,py+h-3+walkAnim,4,3,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(px+w*0.7,py+h-3-walkAnim,4,3,0,0,Math.PI*2);ctx.fill();
  }

  // IT badge
  if(p.it){
    ctx.save();ctx.shadowColor='#ffd700';ctx.shadowBlur=12;
    gtxt('IT',px+w/2,py-14,`800 13px ${FONT}`,'#ffd700','center',10,'rgba(0,0,0,0.9)');
    ctx.restore();
  }
}

  ctx.font=`600 19px ${FONT}`;
  const mw=ctx.measureText(msg).width+44;
  glassPanel(GW/2-mw/2,GH*0.67-20,mw,36,10,ic);
  ctx.save();ctx.shadowColor=ic;ctx.shadowBlur=10;
  txt(msg,GW/2,GH*0.67+8,`600 19px ${FONT}`,ic);
  ctx.restore();
}

// ─── ROUND END ───────────────────────────────────────────────────────────────
function drawRoundEnd(){
  drawBg();drawPlatforms();drawCharacter(P[0]);drawCharacter(P[1]);drawHUD();

  ctx.fillStyle='rgba(2,2,18,0.75)';ctx.fillRect(0,0,GW,GH);

  const sc=P[0].it?1:0,cc=P[sc].color;
  glassPanel(GW/2-234,GH/2-78,468,152,16,cc);

  ctx.save();ctx.shadowColor=cc;ctx.shadowBlur=18;
  txt(roundEndMsg,GW/2,GH/2-30,`700 28px ${FONT}`,cc);
  ctx.restore();
  txt(`Score  ·  P1 ${scores[0]}  –  ${scores[1]} P2`,GW/2,GH/2+14,`600 22px ${FONT}`,'#eef8ff');
  ctx.save();ctx.globalAlpha=0.55;
  txt('Next round starting…',GW/2,GH/2+50,`400 16px ${FONT}`,'#aabbdd');
  ctx.restore();
}

// ─── WIN SCREEN ──────────────────────────────────────────────────────────────
function drawWin(){
  const t=Date.now()/1000;
  const bg=ctx.createLinearGradient(0,0,0,GH);
  bg.addColorStop(0,'#030310');bg.addColorStop(1,'#08051a');
  ctx.fillStyle=bg;ctx.fillRect(0,0,GW,GH);

  // Confetti ribbons
  const cols=[P[0].color,P[1].color,'#ffd700','#44ff88','#ff88ff','#fff','#00eeff'];
  ctx.save();
  for(let i=0;i<60;i++){
    const cx=(i*173+t*60)%GW,cy=(i*97+t*80)%GH,r=2+((i*31)%4);
    ctx.globalAlpha=0.45+0.55*Math.abs(Math.sin(t*2.5+i));
    ctx.fillStyle=cols[i%7];
    ctx.save();ctx.translate(cx,cy);ctx.rotate(t*1.8+i*0.5);
    ctx.beginPath();ctx.roundRect(-r,-r*0.45,r*2,r*0.9,r*0.2);ctx.fill();
    ctx.restore();
  }
  ctx.restore();

  // Winner glow orb
  ctx.save();ctx.globalAlpha=0.1;
  const wo=ctx.createRadialGradient(GW/2,220,20,GW/2,220,300);
  wo.addColorStop(0,P[winnerIdx].color);wo.addColorStop(1,'transparent');
  ctx.fillStyle=wo;ctx.fillRect(0,0,GW,GH);
  ctx.restore();

  const wg=ctx.createLinearGradient(0,68,0,162);
  wg.addColorStop(0,'#ffe040');wg.addColorStop(0.5,'#ffaa00');wg.addColorStop(1,'#ff5500');
  ctx.save();ctx.shadowColor='#ffaa00';ctx.shadowBlur=45;
  txt('Winner!',GW/2,148,`900 76px ${FONT}`,wg);
  ctx.restore();

  ctx.save();ctx.shadowColor=P[winnerIdx].color;ctx.shadowBlur=26;
  txt(`${P[winnerIdx].name} Wins!`,GW/2,212,`700 46px ${FONT}`,P[winnerIdx].color);
  ctx.restore();

  txt(`Final Score  ·  P1 ${scores[0]}  –  ${scores[1]}  P2`,GW/2,268,`600 20px ${FONT}`,'#cce0ff');

  const pHov=inR(mouseX,mouseY,GW/2-125,330,250,52);
  modernBtn(GW/2-125,330,250,52,'Play Again','#0088ff','#0044cc',pHov);
  ctx.save();ctx.globalAlpha=0.3;
  txt('ENTER to play again',GW/2,412,`400 13px ${FONT}`,'#7799bb');
  ctx.restore();
}

// ─── GAME LOOP ────────────────────────────────────────────────────────────────
let prevJ=[false,false];
function update(){
  if(gs!==S.PLAYING)return;
  const j0=K['KeyW']||T.p1j, j1=K['ArrowUp']||T.p2j;
  const e0=j0&&!prevJ[0], e1=j1&&!prevJ[1];
  prevJ[0]=j0; prevJ[1]=j1;
  movePlayer(P[0],K['KeyA']||T.p1l,      K['KeyD']||T.p1r,       e0);
  movePlayer(P[1],K['ArrowLeft']||T.p2l, K['ArrowRight']||T.p2r, e1);
  checkTag();
}
function render(){
  ctx.clearRect(0,0,GW,GH);
  if     (gs===S.MENU)       drawMenu();
  else if(gs===S.HOW)        drawHowTo();
  else if(gs===S.MAP_SELECT) drawMapSelect();
  else if(gs===S.WIN)        drawWin();
  else if(gs===S.COUNTDOWN)  drawCountdown();
  else if(gs===S.ROUND_END)  drawRoundEnd();
  else { drawBg();drawPlatforms();drawCharacter(P[0]);drawCharacter(P[1]);drawHUD(); }
}
function loop(){update();render();requestAnimationFrame(loop);}
loop();
</script>
</body>
</html>
